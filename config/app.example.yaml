app:
  name: Faro
  environment: development
  log_level: INFO

data:
  raw_dir: data/raw
  processed_dir: data/processed
  expected_dir: data/expected
  samples_dir: data/samples

runtime:
  synthetic_seed: 20260731
  timezone: America/Bogota

platform:
  detection: auto
  supported:
    - Linux
    - Windows

ingestion:
  format_registry: src/faro/ingestion/formats.py
  implemented_extensions:
    - .xlsx
    - .pdf
    - .csv
    - .tsv
    - .json
    - .ndjson
    - .jsonl
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
    - .webp
    - .xml
  phase_1_extensions: []
  limits:
    max_file_size_mb: 25
    max_archive_members: 100
    max_archive_depth: 1
    max_delimited_records: 100000
    max_delimited_columns: 100
    max_delimited_field_characters: 100000
    max_json_records: 100000
    max_json_depth: 20
    max_json_fields: 200
    max_json_field_characters: 100000

  delimited:
    encoding: utf-8-sig
    delimiter: auto
    decimal_separator: "."
    date_format: "%Y-%m-%d"
    profiles:
      - products
      - customers
      - suppliers
      - sales
      - inventory
      - orders

  json_records:
    schema_version: "1.0.0"
    date_format: "%Y-%m-%d"
    profiles:
      - products
      - customers
      - suppliers
      - sales
      - inventory
      - orders

  image_documents:
    max_file_size_mb: 25
    max_width: 12000
    max_height: 12000
    max_pixels: 40000000
    min_width: 64
    min_height: 64
    single_frame_only: true
    formats:
      - jpeg
      - png
      - tiff
      - webp


  ubl_xml:
    supported_versions:
      - "2.1"
    supported_roots:
      - Invoice
      - AttachedDocument
    max_file_size_mb: 25
    max_elements: 50000
    max_depth: 50
    max_text_characters: 5000000
    allow_dtd: false
    allow_external_entities: false


persistence:
  engine: sqlite
  database_path: data/processed/faro.db
  schema_version: "1.1.0"
  atomic_replace: true
  logical_hash: true
  include_samples: true
  source_priority:
    ubl_xml: 100
    xlsx: 90
    pdf: 85
    image: 80
    json: 70
    ndjson: 70
    csv: 60
    tsv: 60
indicators:
  config_path: config/indicators.yaml
  active_preset_source: config
  allow_arbitrary_sql: false
  persist_results: true

alerts:
  config_path: config/alerts.yaml
  active_preset_source: config
  allow_arbitrary_sql: false
  allow_arbitrary_code: false
  persist_evaluations: true
  notification_channels:
    implemented:
      - dashboard_store
    planned:
      - email
      - desktop
      - messaging
